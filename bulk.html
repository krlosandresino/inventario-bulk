<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Inventario Bulk</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 600px; box-sizing: border-box; }
        .progress-container { background: #eee; border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 15px; }
        #fill { background: #27ae60; width: 0%; height: 100%; transition: 0.5s; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #f8f9fa; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #eee; }
        #lector { width: 100%; padding: 15px; border: 2px solid #3b82f6; border-radius: 8px; font-size: 16px; text-align: center; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; text-align: center; width: 85%; max-width: 320px; }
        #nombreAuditor { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; margin-bottom: 15px; text-transform: uppercase; outline: none; }
        .btn-check { background: #2ecc71; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; width: 100%; box-sizing: border-box; }
        .btn-anular { background: #e74c3c; }
        .btn-iniciar { width: 100%; height: 45px; font-size: 16px; }
        .ubi-header { color: #000000; padding: 10px 5px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border-bottom: 1px solid #eee; background: #f8fafc; border-radius: 8px; }
        .btn-cerrar { background: #64748b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .table-wrapper { width: 100%; overflow-x: auto; border: 1px solid #eee; border-radius: 8px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { background: #f8f9fa; color: #64748b; padding: 10px; border-bottom: 2px solid #eee; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
        .visto-row { background: #f0fdf4 !important; color: #166534; }
        .input-incidencia { width: 100%; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; box-sizing: border-box; text-transform: uppercase; }
        .input-cantidad { text-align: center; font-weight: bold; color: #3b82f6; min-width: 50px; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px 10px; width: 100%; }
            th, td { padding: 6px 4px; font-size: 11px; }
            .btn-check { padding: 8px 4px; font-size: 10px; }
            .input-incidencia { font-size: 11px; padding: 6px 4px; }
            .input-cantidad { min-width: 45px; }
            .ubi-header { flex-direction: column; gap: 10px; align-items: stretch; text-align: center; }
            .btn-cerrar { width: 100%; padding: 10px; }
            #lector { font-size: 14px; padding: 12px; }
            .stat-card { padding: 8px; }
        }
        
        .btn-borrar-sob { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

<div id="modalPersona" class="modal">
    <div class="modal-content">
        <h3>Responsable para <b id="ubiSpan"></b></h3>
        <input type="text" id="nombreAuditor" placeholder="SU NOMBRE..." autocomplete="off">
        <button class="btn-check btn-iniciar" onclick="iniciar()">EMPEZAR</button>
    </div>
</div>

<div id="modalSobrante" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#b45309;">Agregar Fuera de Stock</h3>
        <small>Ubicación: <b id="ubiSobSpan"></b></small><br><br>
        <input type="text" id="codSob" placeholder="CÓDIGO..." autocomplete="off" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; margin-bottom: 10px; text-transform: uppercase; outline: none;">
        <input type="number" id="cantSob" placeholder="CANTIDAD HALLADA..." autocomplete="off" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; margin-bottom: 15px; outline: none;">
        <div style="display: flex; gap: 10px;">
            <button class="btn-check btn-anular btn-iniciar" onclick="document.getElementById('modalSobrante').style.display='none'">CANCELAR</button>
            <button class="btn-check btn-iniciar" style="background:#f59e0b;" onclick="guardarSobrante()">GUARDAR</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="progress-container"><div id="fill"></div></div>
    <div class="stats">
        <div class="stat-card"><b id="countUbis">0</b><br><small>Ubicaciones</small></div>
        <div class="stat-card"><b id="countPend" style="color:#e67e22">0</b><br><small>Pendientes</small></div>
    </div>
    <input type="text" id="lector" placeholder="ESCANEE UBICACIÓN..." autocomplete="off">
    <div id="listaArea"><center><small style='color:gray'>Esperando ubicaciones...</small></center></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDcHhz-f_oYGaEX2ABtYKqgVEyypSnuz_E",
        authDomain: "inventariobulk.firebaseapp.com",
        projectId: "inventariobulk",
        storageBucket: "inventariobulk.firebasestorage.app",
        messagingSenderId: "962249508789",
        appId: "1:962249508789:web:53c38b692e41c10c8bfbfc",
        databaseURL: "https://inventariobulk-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let dbLocal = [], dbSobrantes = [], ubiActiva = "", auditor = "", bloqueosActivos = {};
    let dbSobrantesObj = {}; // Para la paginación de Firebase
    let timeoutUI = null;

    // BLOQUEO DE PANTALLA ACTIVA (Wake Lock API)
    let wakeLock = null;
    const solicitarWakeLock = async () => {
        try {
            if ('wakeLock' in navigator && !wakeLock) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) { }
    };
    document.addEventListener('click', solicitarWakeLock);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') solicitarWakeLock();
    });
    solicitarWakeLock();

    // VIBRACIÓN HÁPTICA
    function vibrar(tipo) {
        if ("vibrate" in navigator) {
            if (tipo === 'exito') navigator.vibrate(50); 
            if (tipo === 'error') navigator.vibrate([100, 50, 100]); 
        }
    }

    // MOTOR DE RENDERIZADO OPTIMIZADO
    function optimizarRender() {
        clearTimeout(timeoutUI);
        timeoutUI = setTimeout(() => {
            actualizarUI();
            if(ubiActiva) renderUbi();
        }, 100);
    }

    // LECTURA OPTIMIZADA DE FIREBASE (Paginación de Nodos para ahorrar datos)
    db.ref('inventario_actual/items').on('child_added', snap => { dbLocal[snap.key] = snap.val(); optimizarRender(); });
    db.ref('inventario_actual/items').on('child_changed', snap => { dbLocal[snap.key] = snap.val(); optimizarRender(); });
    db.ref('inventario_actual/items').on('child_removed', snap => { delete dbLocal[snap.key]; optimizarRender(); });

    db.ref('inventario_actual/sobrantes').on('child_added', snap => { dbSobrantesObj[snap.key] = {id: snap.key, ...snap.val()}; actualizarSobrantes(); });
    db.ref('inventario_actual/sobrantes').on('child_changed', snap => { dbSobrantesObj[snap.key] = {id: snap.key, ...snap.val()}; actualizarSobrantes(); });
    db.ref('inventario_actual/sobrantes').on('child_removed', snap => { delete dbSobrantesObj[snap.key]; actualizarSobrantes(); });

    function actualizarSobrantes() {
        dbSobrantes = Object.values(dbSobrantesObj);
        optimizarRender();
    }

    db.ref('inventario_actual/bloqueos').on('child_added', snap => { bloqueosActivos[snap.key] = snap.val(); });
    db.ref('inventario_actual/bloqueos').on('child_changed', snap => { bloqueosActivos[snap.key] = snap.val(); });
    db.ref('inventario_actual/bloqueos').on('child_removed', snap => { delete bloqueosActivos[snap.key]; });

    // EVENTOS DE TECLADO
    document.getElementById('nombreAuditor').onkeydown = e => { if(e.key === 'Enter') iniciar(); };
    document.getElementById('codSob').onkeydown = e => { if(e.key === 'Enter') document.getElementById('cantSob').focus(); };
    document.getElementById('cantSob').onkeydown = e => { if(e.key === 'Enter') guardarSobrante(); };

    document.getElementById('lector').onkeydown = e => {
        if(e.key === 'Enter') {
            const val = e.target.value.toUpperCase().trim();
            if(dbLocal.some(i => i && i.datos && i.datos[0] === val)) {
                
                if (bloqueosActivos[val]) {
                    vibrar('error');
                    const ocupadoPor = bloqueosActivos[val];
                    const confirmar = confirm(`⚠️ ALERTA DE COLISIÓN ⚠️\n\nEl pallet ${val} ya está siendo auditado por: ${ocupadoPor}.\n\n¿Desea forzar la entrada y tomar el control del pallet de todas formas?`);
                    if (!confirmar) {
                        e.target.value = '';
                        return; 
                    }
                }

                vibrar('exito');
                ubiActiva = val;
                auditor = ""; 
                document.getElementById('ubiSpan').innerText = val;
                document.getElementById('nombreAuditor').value = ""; 
                document.getElementById('modalPersona').style.display = 'flex';
                setTimeout(() => document.getElementById('nombreAuditor').focus(), 150);
            } else {
                vibrar('error');
                alert("Ubicación no encontrada.");
            }
            e.target.value = '';
        }
    };

    function iniciar() {
        const inputNombre = document.getElementById('nombreAuditor').value.toUpperCase().trim();
        if(!inputNombre) {
            vibrar('error');
            return alert("Ingrese su nombre");
        }
        vibrar('exito');
        auditor = inputNombre;
        document.getElementById('modalPersona').style.display = 'none';
        db.ref(`inventario_actual/bloqueos/${ubiActiva}`).set(auditor);
        renderUbi();
    }

    function cerrarUbicacion() {
        if (ubiActiva) db.ref(`inventario_actual/bloqueos/${ubiActiva}`).remove();
        ubiActiva = "";
        auditor = "";
        document.getElementById('listaArea').innerHTML = "<center><br><small style='color:gray'>Ubicación cerrada. Escanee la siguiente...</small></center>";
        document.getElementById('lector').focus();
    }

    function renderUbi() {
        const area = document.getElementById('listaArea');
        const items = dbLocal.filter(i => i && i.datos && i.datos[0] === ubiActiva);
        const sobrantesUbi = dbSobrantes.filter(s => s.ubicacion === ubiActiva);

        let html = `
            <div class="ubi-header">
                <div>
                    <span>📦 Ubicación: <b>${ubiActiva}</b></span><br>
                    <span>👤 Responsable: <b>${auditor}</b></span>
                </div>
                <button class="btn-cerrar" onclick="cerrarUbicacion()">✖️ Cerrar Pallet</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>CÓDIGO</th><th>CANT</th><th>INCIDENCIA</th><th>ACCIÓN</th></tr></thead>
                    <tbody>
        `;
        
        items.forEach(i => {
            html += `
                <tr class="${i.visto ? 'visto-row' : ''}">
                    <td><b>${i.datos[1]}</b></td>
                    <td><input type="number" id="cant_${i.rowId}" class="input-incidencia input-cantidad" placeholder="0" value="${i.cantidadHallada || ''}" ${i.visto ? 'disabled' : ''}></td>
                    <td><input type="text" class="input-incidencia" placeholder="Nota..." value="${i.incidencia || ''}" onchange="guardarIncidencia(${i.rowId}, this.value)"></td>
                    <td><button class="btn-check ${i.visto ? 'btn-anular' : ''}" onclick="marcar(${i.rowId})">${i.visto ? 'ANULAR' : 'INGRESAR'}</button></td>
                </tr>
            `;
        });
        html += `</tbody></table></div>`;

        html += `
            <div style="margin-top: 20px; border: 2px dashed #f59e0b; border-radius: 8px; padding: 12px; background: #fffbeb; text-align: left;">
                <h4 style="margin: 0 0 10px 0; color: #b45309; font-size: 13px; text-align: center;">⚠️ CÓDIGOS FUERA DE STOCK / SOBRANTES</h4>
                <table style="width:100%; font-size:12px; margin-bottom:10px; border-collapse: collapse;">
        `;
        
        if (sobrantesUbi.length === 0) {
            html += `<tr><td style="text-align:center; color:#92400e; padding:5px; border:none;">No hay códigos sobrantes registrados.</td></tr>`;
        } else {
            sobrantesUbi.forEach(s => {
                html += `
                    <tr style="background:white; border-bottom: 2px solid #fde68a;">
                        <td style="padding: 10px;">Código:<br><b style="font-size:14px;">${s.codigo}</b></td>
                        <td style="padding: 10px; color:#b45309; font-weight:bold;">Cant:<br><span style="font-size:14px;">${s.cantidad}</span></td>
                        <td style="padding: 10px; text-align:right;"><button class="btn-borrar-sob" onclick="eliminarSobrante('${s.id}')">BORRAR</button></td>
                    </tr>
                `;
            });
        }
        
        html += `
                </table>
                <button class="btn-check" style="background:#f59e0b; width:100%; padding:12px; font-size: 13px;" onclick="abrirModalSobrante()">➕ AGREGAR CÓDIGO SOBRANTE</button>
            </div>
        `;

        area.innerHTML = html;
    }

    function abrirModalSobrante() {
        document.getElementById('ubiSobSpan').innerText = ubiActiva;
        document.getElementById('codSob').value = "";
        document.getElementById('cantSob').value = "";
        document.getElementById('modalSobrante').style.display = 'flex';
        setTimeout(() => document.getElementById('codSob').focus(), 150);
    }

    function guardarSobrante() {
        const cod = document.getElementById('codSob').value.toUpperCase().trim();
        const cant = document.getElementById('cantSob').value.trim();

        if(!cod || !cant) {
            vibrar('error');
            return alert("Ingrese el código y la cantidad hallada");
        }

        db.ref('inventario_actual/sobrantes').push({
            ubicacion: ubiActiva,
            codigo: cod,
            cantidad: cant,
            auditor: auditor
        }).then(() => {
            vibrar('exito');
            document.getElementById('modalSobrante').style.display = 'none';
        });
    }

    function eliminarSobrante(id) {
        if(confirm("¿Seguro que desea eliminar este código sobrante?")) {
            vibrar('exito');
            db.ref(`inventario_actual/sobrantes/${id}`).remove();
        }
    }

    function marcar(id) {
        const item = dbLocal[id];
        if(item.visto && item.auditor !== auditor) {
            vibrar('error');
            return alert("Marcado por: " + item.auditor);
        }
        
        if (!item.visto) {
            const cantInput = document.getElementById('cant_' + id).value.trim();
            if(cantInput === "") {
                vibrar('error');
                return alert("Por favor, ingrese la cantidad física hallada en la ubicación.");
            }
            vibrar('exito');
            db.ref(`inventario_actual/items/${id}`).update({ 
                visto: true, 
                auditor: auditor,
                cantidadHallada: cantInput
            });
        } else {
            vibrar('exito');
            db.ref(`inventario_actual/items/${id}`).update({ 
                visto: false, 
                auditor: "",
                cantidadHallada: null
            });
        }
    }

    function guardarIncidencia(id, texto) {
        db.ref(`inventario_actual/items/${id}`).update({ incidencia: texto.toUpperCase() });
    }

    function actualizarUI() {
        const itemsValidos = dbLocal.filter(i => i && i.datos);
        const ubis = [...new Set(itemsValidos.map(i => i.datos[0]))];
        const pend = ubis.filter(u => itemsValidos.filter(i => i.datos[0]===u).some(i => !i.visto)).length;
        document.getElementById('countUbis').innerText = ubis.length;
        document.getElementById('countPend').innerText = pend;
        document.getElementById('fill').style.width = ubis.length ? ((ubis.length-pend)/ubis.length)*100+'%' : '0%';
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) return false;
    };
</script>
</body>
</html>
